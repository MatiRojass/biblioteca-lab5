<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition template="layout2.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core">

    <ui:define name="contenido-principal">

        <h2 style="font-size: 35px; font-weight: bold; padding-bottom: 20px">Agregar Nueva Revista</h2>
        <div class="contenedor-agregar-clientes" style="margin-bottom: 40px;">
            <h:form id="add-revista" style="display: flex; flex-direction: column; gap: 15px; border: 1px solid #000; padding: 15px; width: 100%;">
                
                <h:messages globalOnly="false" style="color: red; font-weight: bold;" />

                <h:outputLabel for="titulo" value="Nombre del Revista" />
                <h:inputText id="titulo" value="#{revistaBean.revista.nombre}" required="true" requiredMessage="El nombre es obligatorio" />

                <div style="display: flex; gap: 20px;">
                    <div style="flex: 1; display: flex; flex-direction: column;">
                        <h:outputLabel for="anio" value="Año de Publicación" />
                        <h:inputText id="anio" value="#{revistaBean.revista.anio}" required="true" />
                    </div>
                    <div style="flex: 1; display: flex; flex-direction: column;">
                        <h:outputLabel for="editorial" value="Editorial" />
                        <h:inputText id="editorial" value="#{revistaBean.revista.editorial}" required="true" />
                    </div>
                    
                    <div style="flex: 1; display: flex; flex-direction: column;">
                        <h:outputLabel for="volumen" value="Volumen" />
                        <h:inputText id="volumen" value="#{revistaBean.revista.volumen}" required="true" />
                    </div>
                </div>

                

                

                <div style="display: flex; gap: 20px;">
                    
                    <div style="flex: 1; display: flex; flex-direction: column;">
                        <h:outputLabel for="cat_id" value="Categoría" />
                        <h:selectOneMenu id="cat_id" value="#{revistaBean.revista.categoriasId}" required="true" requiredMessage="Seleccione una categoría" style="padding: 8px; border-radius: 4px; border: 1px solid #333;">
                            <f:selectItem itemLabel="-- Seleccionar Categoría --" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{revistaBean.categorias}" var="cat" itemValue="#{cat.id}" itemLabel="#{cat.nombre}" />
                        </h:selectOneMenu>
                    </div>

                    

                </div>

                <h:commandButton value="Guardar Revista" action="#{revistaBean.guardar()}" style="background-color: #2563eb; color: white; padding: 10px; cursor: pointer; border-radius: 6px; font-weight: bold; margin-top: 10px;">
                    <f:ajax execute="@form" render="@form :panelTablaRevistas" />
                </h:commandButton>
            </h:form>
        </div>


        <section class="contenedor-tabla-libros">
            <h:panelGroup id="panelTablaRevistas" layout="block">
                <table class="tabla">
                    <thead>
                        <tr>
                            <th>NOMBRE</th>
                            <th>AÑO</th>
                            <th>EDITORIAL</th>
                            <th>VOLUMEN</th>
                            <th>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody>
                        <ui:repeat value="#{revistaBean.revistas}" var="revistaItem">
                            <tr>
                                <td>#{revistaItem.nombre}</td>
                                <td>#{revistaItem.anio}</td>
                                <td>#{revistaItem.editorial}</td>
                                <td>#{revistaItem.volumen} un.</td>
                                <td style="display: flex; gap: 10px;">
                                    <h:form>
                                        <h:link outcome="descripcion-libros" value="Ver Detalle" style="color: #007BFF; font-weight: bold; margin-right: 15px;" />
                                        
                                        <h:commandLink value="Editar" action="#{revistaBean.seleccionar(revistaItem)}" style="color: #28a745; margin-right: 15px;">
                                            <f:ajax render=":add-revista" />
                                        </h:commandLink>
                                        
                                        <h:commandLink value="Eliminar" action="#{revistaBean.eliminar(revistaItem.id)}" style="color: red;" onclick="return confirm('¿Eliminar libro?');">
                                            <f:ajax render=":panelTablaRevistas" />
                                        </h:commandLink>
                                    </h:form>
                                </td>
                            </tr>
                        </ui:repeat>
                    </tbody>
                </table>
            </h:panelGroup>
        </section>

    </ui:define>

    <ui:define name="aside">
        <aside class="contenedor-filtrado-categoria">
            <h3>Filtrar Libros por Categorías</h3>
            
            <details open="open">
                <summary>Género</summary>
                <h:form>
                    <label><h:selectBooleanCheckbox /> Realismo Mágico</label>
                    <label><h:selectBooleanCheckbox /> Cuento</label>
                    <label><h:selectBooleanCheckbox /> Fantasía</label>
                    <label><h:selectBooleanCheckbox /> Novela</label>
                </h:form>
            </details>
        </aside>
    </ui:define>

</ui:composition>
