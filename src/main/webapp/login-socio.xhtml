<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition template="layout2.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="jakarta.faces.passthrough">

    <ui:define name="contenido-principal">
        
        <div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
            
            <div style="background-color: #374151; padding: 40px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                
                <h2 style="color: white; font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 20px;">
                    Acceso para Socios
                </h2>

                <h:form id="form-login-socio" style="display: flex; flex-direction: column; gap: 15px;">
                    
                    <h:messages globalOnly="true" style="color: #ef4444; font-weight: bold; text-align: center; list-style: none; padding: 0;" />

                    <div>
                        <h:outputLabel for="dni" value="DNI" style="color: white; font-weight: bold; display: block; margin-bottom: 5px;" />
                        <h:inputText id="dni" value="#{loginSocioBean.dni}" required="true" requiredMessage="El DNI es obligatorio" p:type="number" p:placeholder="Sin puntos ni espacios" style="width: 100%; padding: 10px; border-radius: 4px; border: none;" />
                    </div>

                    <div>
                        <h:outputLabel for="password" value="Contraseña" style="color: white; font-weight: bold; display: block; margin-bottom: 5px;" />
                        <h:inputSecret id="password" value="#{loginSocioBean.password}" required="true" requiredMessage="La contraseña es obligatoria" p:placeholder="••••••••" style="width: 100%; padding: 10px; border-radius: 4px; border: none;" />
                    </div>

                    <h:commandButton value="Ingresar" action="#{loginSocioBean.login}" style="background-color: #10b981; color: white; font-weight: bold; padding: 12px; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 100%;" />
                    
                </h:form>
                
            </div>
        </div>

    </ui:define>

    <ui:define name="aside"></ui:define>

</ui:composition>
