<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition template="layout2.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core">

    <ui:define name="contenido-principal">
        <div style="padding: 20px; min-height: 50vh;">
            <h2 style="font-size: 35px; font-weight: bold; margin-bottom: 20px;">Mi Carrito de Reservas</h2>

            <h:messages globalOnly="true" style="color: #ef4444; font-weight: bold; margin-bottom: 15px; list-style: none; font-size: 18px;" />
            
            <h:form id="form-carrito">
                
                <h:outputText value="Tu carrito está vacío. ¡Ve al inicio a buscar algunos libros!" rendered="#{empty prestamoBean.carritoReserva}" style="font-size: 18px; color: gray;" />

                <h:panelGroup rendered="#{not empty prestamoBean.carritoReserva}">
                    <table class="tabla" style="width: 100%; margin-bottom: 20px;">
                        <thead>
                            <tr>
                                <th>TÍTULO</th>
                                <th>EDITORIAL</th>
                                <th>AÑO</th>
                            </tr>
                        </thead>
                        <tbody>
                            <ui:repeat value="#{prestamoBean.carritoReserva}" var="lib">
                                <tr>
                                    <td style="font-weight: bold;">#{lib.titulo}</td>
                                    <td>#{lib.editorial}</td>
                                    <td>#{lib.year}</td>
                                </tr>
                            </ui:repeat>
                        </tbody>
                    </table>

                    <div style="display: flex; justify-content: flex-end;">
                        <h:commandButton value="Confirmar Préstamo" action="#{prestamoBean.confirmarPrestamo}" style="background-color: #10b981; color: white; padding: 12px 25px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px;" />
                    </div>
                </h:panelGroup>

            </h:form>
        </div>
    </ui:define>

    <ui:define name="aside"></ui:define>

</ui:composition>
